# tuning_sweep.yaml — shared params for the HaptiQuad-Nav CONTACT-PROBE
# PARAMETER-TUNING harness (tuning_sweep_orchestrator.py / tuning_trial_logger.py).
#
# Completely independent from sweep.yaml (mass/mu classification sweep) and
# timing_sweep.yaml (lateral-length sweep): separate config, launch file,
# orchestrator/logger nodes, message type (TuningTrialStart), results
# directory. All three may run against the same long-lived navigation.launch
# stack (contact_probe_manager, move_base) but never at the same time.
#
# Question under test: which contact-probe TIMING parameters most affect how
# long classification takes, and at what cost to correctness? Object mass/mu
# and geometry are held FIXED at two representative points (one confirmed
# MOVABLE, one confirmed SOLID by the mass/mu sweep) -- only contact-probe
# parameters that can influence classification TIME are swept, in a full
# factorial design. Force thresholds (contact_force_
# threshold_n, classification_force_threshold_n) and map/costmap parameters
# (solid/movable exclusion radii, backup geometry, obstacle_assumed_depth,
# etc.) are deliberately NOT included here -- they affect correctness or
# downstream navigation, not classification time, and the mass/mu sweep
# already covers them.

experiment_tag: "tuning_sweep_02"

# ── Fixed object (single size, NOT swept -- this experiment is about
# contact-probe timing parameters, not obstacle geometry) ──────────────────
geometry: box
size_x: 0.5
size_y: 0.5
size_z: 1.0

# Mass/mu for each arm -- confirmed MOVABLE/SOLID across the whole mass/mu
# sweep. The movable point matches movable_box_* in mixed_obstacles_test.world;
# note timing_sweep.yaml's movable arm now uses 15kg instead.
movable_mass_kg: 5.0
movable_mu: 0.1
solid_mass_kg: 200.0
solid_mu: 0.8

# ── Approach / goal geometry (fixed, not swept) ────────────────────────────
approach_distance: 3.0
goal_overshoot: 1.5     # only needs to be a valid point past the obstacle for
                        # the initial approach goal -- irrelevant to how this
                        # experiment ends (see "Trial end condition" below)
settle_time: 1.0
reset_settle_time: 1.5

# ── Full-factorial grid ────────────────────────────────────────────────────
# EVERY combination of the values below is run (tuning_sweep_01 was
# one-at-a-time, which misses interactions -- e.g. a short contact_hold_time
# may only be safe with a large wrench_filter_window). The grid size
# multiplies, so each list is kept short, using what tuning_sweep_01 showed:
#   - wrench_filter_window and probe_distance barely moved timing or
#     accuracy -> 2 values each.
#   - probe_distance <= 0.55 never triggers (nearest return is always >
#     cloud_range_min 0.55m); must also stay < slow_approach_distance (0.7m).
#   - contact_hold_time is the biggest time lever and the one that starts
#     accepting gait noise when short -> 4 values.
#   - classification_force_settle_time must leave >= min_settled_window_s
#     of the classify_time window to average over; violating combinations
#     are skipped (none with the grids below).
# 3 x 2 x 4 x 3 x 3 x 2 = 432 combinations x 2 arms x repeats.
# sweep_params fixes the iteration order (a loaded rosparam dict's key order
# is not guaranteed).
sweep_params:
  - probe_speed
  - probe_distance
  - contact_hold_time
  - classify_time
  - classification_force_settle_time
  - wrench_filter_window

param_grids:
  probe_speed: [0.20, 0.30, 0.40]                      # [m/s]
  probe_distance: [0.60, 0.65]                         # [m]
  contact_hold_time: [0.2, 0.4, 0.6, 1.0]              # [s]
  classify_time: [0.45, 0.6, 0.9]                      # [s]
  classification_force_settle_time: [0.1, 0.2, 0.3]   # [s]
  wrench_filter_window: [25, 50]                       # [samples]

min_settled_window_s: 0.15   # [s] classify_time - settle_time lower bound

# 432 x 2 arms x 2 = 1728 trials (~7h at the ~15s/trial seen so far). Every
# combination gets 4 trials (2 per arm); each "vs param" main-effect point
# pools hundreds. Re-run the best few combinations from combo_ranking.csv
# with more repeats before committing to one.
repeats: 2

# ── Trial end condition ────────────────────────────────────────────────────
# Deliberately different from BOTH other sweeps: this trial ends the INSTANT
# CLASSIFYING resolves (to NORMAL_NAV for MOVABLE, or to BACKING_UP for
# SOLID) -- it does NOT wait for BACKING_UP to complete like the mass/mu
# sweep's trial_logger.py, and does NOT wait for the real goal like
# timing_trial_logger.py's GoalCompletionWatcher. The experiment only cares
# about classification time, so running the backup/replan/re-approach
# maneuver afterward would only burn wall-clock time on data this sweep
# never uses. See ClassificationWatcher in trial_core.py.
no_contact_timeout: 25.0   # [s] give up waiting for CONTACT_PROBE entry
trial_timeout: 60.0        # [s] overall per-trial safety net -- shorter than
                           # the other sweeps' since there's no BACKING_UP
                           # wait here

# ── Optional Gazebo speed-up (EXPERIMENTAL) ────────────────────────────────
# Best-effort request for Gazebo to target this multiple of real-time by
# scaling max_update_rate only (physics step SIZE, gravity, and ODE solver
# settings are left untouched, so simulated dynamics/timing fidelity is
# unaffected -- only how many wall-clock seconds it takes to compute them).
# Since navigation.launch sets /use_sim_time:true, every timestamp this
# harness records (rospy.Time.now()) is SIM time, so classification-time
# metrics are unaffected by whatever factor is actually achieved -- only how
# long you wait in the real world for the sweep to finish. If the CPU can't
# keep up, Gazebo just falls back to whatever real factor it can sustain --
# this is a target, not a guarantee. Restored to its original value
# automatically when the sweep ends (or is killed) via rospy.on_shutdown.
# NOT verified against the proprietary ANYmal controller/estimator stack's
# own internal timing assumptions -- if stability/estimator-health metrics
# (peak_roll_deg, cpm_wrench_latency_ms_mean) get visibly worse only at
# speed_factor > 1, the low-level stack doesn't tolerate it well; drop back
# to 1.0.
speed_factor: 1.0    # 1.0 = disabled (real-time). Try 2.0 for a 2x target.

# Where CSVs are written. Defaults to <this package>/.results/<tag> (same
# gitignored, host-visible folder the other two sweeps use) under its own
# tag, so no results folder ever collides.
# results_dir: "/home/anydev/haptiquad_eval_results"
